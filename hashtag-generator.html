<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b16">

    <title>Gaming Hashtag Generator - GamingTools Hub</title>
    <meta
    name="description"
    content="Generate gaming hashtags for YouTube Shorts, Instagram Reels and gaming posts."
>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="hashtag-generator.css">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        <span>🎮</span>
        Gaming<span>Tools</span>
    </a>

    <a href="index.html" class="back-home">
        ← Home
    </a>

</header>


<main class="hashtag-page">

    <section class="hashtag-box">

        <div class="hashtag-heading">

            <div class="hashtag-icon">
                #
            </div>

            <p class="small-title">
                GAMING TOOL
            </p>

            <h1>
                Gaming Hashtag Generator
            </h1>

            <p>
                Generate gaming hashtags for YouTube Shorts,
                Instagram and gaming posts.
            </p>

        </div>


        <div class="form-group">

            <label for="gameName">
                Game / Topic
            </label>

            <input
                type="text"
                id="gameName"
                placeholder="Example: BGMI"
                maxlength="30"
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label for="platform">
                Platform
            </label>

            <select id="platform">

                <option value="youtube">
                    YouTube Shorts
                </option>

                <option value="instagram">
                    Instagram Reels
                </option>

                <option value="general">
                    General Gaming
                </option>

            </select>

        </div>


        <button
            class="generate-hashtag-btn"
            onclick="generateHashtags()"
        >
            ⚡ Generate Hashtags
        </button>


        <div
            id="hashtagResult"
            class="hashtag-result"
        >

            <div class="empty-message">
                Enter a game or topic to generate hashtags 🎮
            </div>

        </div>


        <button
            id="copyAllBtn"
            class="copy-all-btn hidden"
            onclick="copyAllHashtags()"
        >
            📋 Copy All Hashtags
        </button>

    </section>

</main>


<footer>

    <div class="footer-logo">
        🎮 GamingTools Hub
    </div>

    <p>
        © 2026 GamingTools Hub. All rights reserved.
    </p>

</footer>


<script src="hashtag-generator.js"></script>

</body>
</html>
